name: Windows VST3 host check

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Windows VST3 build run containing the preview artifact'
        required: true
        type: string
        default: '38705922324'

permissions:
  actions: read
  contents: read

jobs:
  validate-vst3:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify the selected build run
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $logs = Join-Path $env:GITHUB_WORKSPACE 'host-check-logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          if ($env:BUILD_RUN_ID -notmatch '^[1-9][0-9]{0,19}$') {
            throw 'build_run_id must be a positive GitHub Actions run ID'
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID"
          $run = Invoke-RestMethod -Uri $uri -Headers $headers
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success' -or
              $run.path -ne '.github/workflows/windows.yml' -or
              $run.head_branch -ne 'main' -or
              $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or
              $run.event -notin @('push', 'workflow_dispatch')) {
            throw 'Select a successful Windows VST3 build on this repository main branch, triggered by push or workflow_dispatch'
          }
          @{
            buildRunId = $env:BUILD_RUN_ID
            buildRunUrl = $run.html_url
            sourceCommit = $run.head_sha
            artifact = 'aurora-windows-x64-preview'
            validationScope = 'Native Windows VST3 host tests with GUI tests disabled; not a GPU or DAW playback test'
          } | ConvertTo-Json | Set-Content -Path (Join-Path $logs 'build-run.json') -Encoding utf8

      - name: Download the selected Windows preview
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aurora-windows-x64-preview
          path: downloaded-preview
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Verify and unpack the plug-in download
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'downloaded-preview'
          $archives = @(Get-ChildItem -LiteralPath $artifact -Filter 'Aurora-*-windows-x64.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected exactly one Aurora Windows binary ZIP' }
          $archive = $archives[0]
          $manifestName = $archive.Name -replace '-windows-x64.zip$', '-windows-MANIFEST.json'
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $artifact $manifestName) | ConvertFrom-Json -AsHashtable
          $expected = $manifest.archives[$archive.Name].sha256
          $actual = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$' -or $actual -ne $expected) {
            throw 'Aurora binary ZIP does not match its build manifest'
          }
          $unpacked = Join-Path $env:GITHUB_WORKSPACE 'unpacked-preview'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $unpacked
          $bundle = Join-Path $unpacked 'Aurora/VST3/Aurora.vst3'
          $binary = Join-Path $bundle 'Contents/x86_64-win/Aurora.vst3'
          $binaryHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($binaryHash -ne $manifest.binary.sha256) { throw 'Extracted VST3 does not match its build manifest' }
          $logs = Join-Path $env:GITHUB_WORKSPACE 'host-check-logs'
          @{
            archive = $archive.Name
            archiveSha256 = $actual
            binarySha256 = $binaryHash
          } | ConvertTo-Json | Set-Content -Path (Join-Path $logs 'tested-binary.json') -Encoding utf8
          "AURORA_PLUGIN_PATH=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PLUGINVAL_LOG_DIR=$logs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download and verify pluginval 1.0.4
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'pluginval-v1.0.4-Windows.zip'
          $url = 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip'
          $expected = 'c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'pluginval download checksum mismatch' }
          $directory = Join-Path $env:RUNNER_TEMP 'pluginval-v1.0.4'
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $executable = Join-Path $directory 'pluginval.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw 'pluginval.exe is missing' }
          @{
            version = '1.0.4'
            source = $url
            archiveSha256 = $actual
          } | ConvertTo-Json | Set-Content -Path (Join-Path $env:PLUGINVAL_LOG_DIR 'validator.json') -Encoding utf8
          "PLUGINVAL_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate the native VST3 without opening its editor
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $consoleLog = Join-Path $env:PLUGINVAL_LOG_DIR 'pluginval-console.log'
          & $env:PLUGINVAL_EXE --strictness-level 5 --skip-gui-tests --timeout-ms 30000 `
            --random-seed 123456 --output-dir $env:PLUGINVAL_LOG_DIR `
            --validate $env:AURORA_PLUGIN_PATH *> $consoleLog
          $result = $LASTEXITCODE
          Get-Content -LiteralPath $consoleLog
          @{
            exitCode = $result
            passed = ($result -eq 0)
            strictnessLevel = 5
            guiTestsEnabled = $false
            randomSeed = 123456
            inactivityTimeoutMs = 30000
          } | ConvertTo-Json | Set-Content -Path (Join-Path $env:PLUGINVAL_LOG_DIR 'result.json') -Encoding utf8
          if ($result -ne 0) { throw "pluginval failed with exit code $result" }

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-host-check-${{ github.run_id }}
          path: host-check-logs/
          if-no-files-found: warn
          retention-days: 14
